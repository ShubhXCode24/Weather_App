<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- First Layout -->
    <div class="mainBox mainBox1">
        <img src="/Images/snow.png" id="drizzleIcon">
        <h1 id="weather">Weather</h1>
        <h2 id="forecasts">ForeCasts</h2>
        <button id="btnOne">Get Start</button>
    </div>

    <!-- Second Layout -->
    <div class="mainBox mainBox2 inactive">
        <div class="searchBox">
            <input type="text" placeholder="Search City" id="inputField">
            <i id="searchIcon" class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="iconBox">
            <img src="Images/clouds.png" id="icon">
            <p id="des">Description</p>
        </div>

        <div class="tempBox">
            <h1 id="temp">0°C</h1>
            <h3 id="city">New Delhi</h3>
        </div>

        <div class="details">
            <div class="wind">
                <img src="Images/wind.png" id="windIcon">
                <div class="windData">
                    <p id="windSpeed">0km/h</p>
                    <p>Wind</p>
                </div>
            </div>
            <div class="humidity">
                <img src="Images/humidity.png" id="humidityIcon">
                <div class="humidityData">
                    <p id="humidityType">0%</p>
                    <p>Humidity</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Third Layout -->
    <div class="mainBox mainBox3 inactive">
        <h1 id="txt">404</h1>
        <p id="error">Oops! Page Not Found</p>
        <p id="info">"The page you're looking for doesn't exist or has been removed"</p>
        <button id="secondBtn">Go Home</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
